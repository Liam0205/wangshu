name: nightly-diff-fuzz

# Long-running differential fuzz + automatic issue filing (engineering.md §3.2):
#   - The PR gate (ci.yml) uses fixed seeds against regressions; this workflow
#     explores new ground with hourly rolling seeds;
#   - Real divergences (byte-diff) and environment failures (oracle
#     unavailable, ...) are filed as separate issues, keeping signals apart;
#   - Divergences it hits should be minimized and folded back into conformance
#     cases (12 §3.6) so regression coverage does not rely on randomly hitting
#     them again.

on:
  schedule:
    # One round every 4 hours (6/day; raised from daily on 2026-07-10).
    # A round's wall-clock is ~3h40m, and a brief overlap with the next
    # round on an extremely slow run is harmless: concurrent runs land in
    # different hour buckets (different SEED_BASE, so seed segments never
    # clash), issues are deduped by title, and the only cost is a brief 2x
    # runner occupancy -- the interval is a budget choice, not an
    # anti-overlap constraint. The seed space rolls by hour epoch (see
    # SEED_BASE); each round explores a different segment, so more
    # frequency means more coverage.
    - cron: '0 */4 * * *'
  workflow_dispatch:
    inputs:
      rounds:
        description: 'random scripts (oracle differential)'
        default: '2000000'
      gcstress:
        description: 'random scripts (GC stress dual-mode)'
        default: '200000'
      gofuzztime:
        # "per target", and there are SIX source-visible untagged targets, not four: the root package's
        # FuzzCompileRun / FuzzAutoPromote / FuzzP4ForceAllPromote plus one each in internal/frontend/lex,
        # internal/frontend/parse and internal/stdlib. FuzzOracleDiff is gated behind wangshu_oracle_cgo
        # and runs in its own step. The stale "4" is why the step's cost was consistently underestimated.
        description: 'go-fuzz time per target (6 untagged targets; FuzzOracleDiff is separate)'
        # 35m, not 45m (2026-08-19). go-fuzz.sh runs EVERY source-visible target for the full
        # fuzztime, so this value is multiplied by the target count: 45m measured 270 min on the p4
        # leg, leaving the 350m job with ~38 min of margin, and three runs were killed by the job
        # timeout in a week (2026-08-12 p4, 08-15 p4, 08-18 p1). 35m brings the leg to roughly 250 min
        # and the margin to ~98 min.
        #
        # This is a real reduction in exploration -- about 22% less fuzzing per run -- chosen over
        # trimming the differential steps because those are cheap in practice (rolling-seed 36 min,
        # auto-mode 2 min) while this step is 87% of the job. An earlier plan to trim auto-mode from
        # 150m to 90m would have saved nothing: its cap is a hang guard, and it has never come near it.
        default: '35m'

permissions:
  contents: read
  issues: write

jobs:
  diff-fuzz:
    # Matrix covers: p1 = crescent (new-moon) interpreter path;
    #                p3 = gibbous wasm (P3) promoted path;
    #                p4 = gibbous jit (P4) native promoted path (added 2026-07-01
    #                     to close V21 30-day longevity + V22 30-day guard-omission
    #                     accumulation for P4; see docs/design/p4-method-jit/
    #                     08-testing-strategy.md V21/V22).
    # All three build tiers share the same fuzz input corpus but exercise
    # different VM paths -- rolling-seed diff + GC-stress + go-fuzz native long
    # run guard byte-equal / no-crash for each tier every night.
    strategy:
      fail-fast: false # a build hitting divergence does not stop others from continuing
      matrix:
        include:
          # native_fuzz_cap: the native go-fuzz step's bound, PER TIER, because two things differ.
          #
          # The legitimate worst case scales with the tier's target count (measured 4 / 5 / 6 target-runs,
          # so 140 / 175 / 210 min at 35m, plus up to two per-target golang/go#75804 retries). And the room
          # differs: every later step runs `if: always()`, so what must fit under the 350-minute job cap is
          # prior + this bound + every later always() bound -- and p1 alone carries the oracle-diff step in
          # that tail (80 + 15 + 10 = 105, against p3/p4's 25). A PR review caught that bounding this step
          # alone still let the job cap fire first on p1, losing the triage that files the issue.
          #
          # p1: 38 + 195 + 105 = 338 < 350. 195 is under p1's 210 two-retry worst case, so a p1 run that
          #     retries twice is indistinguishable from a hang -- accepted, because retries measured 9 in
          #     ~450 jobs and never twice in one job, and the trade buys a guaranteed triage.
          # p3/p4: 40 + 280 + 25 = 345 < 350, and 280 covers p4's 280 exactly.
          - variant: p1
            tags: ''
            native_fuzz_cap: 202
            native_fuzz_targets: 4
            # fuzztime is PER TIER now, because the chain constraint differs per tier: p3/p4 carry a second
            # fuzz step (tiered-oracle) that p1 does not, so a single value either overpays on p1 or
            # overruns on p4. Derived from prior(40) + native_cap + tiered_cap + oracle/upload/triage < 350.
            fuzztime: 32m
            tiered_fuzz_cap: 0
          - variant: p3
            tags: 'wangshu_p3 wangshu_profile'
            native_fuzz_cap: 206
            native_fuzz_targets: 5
            fuzztime: 28m
            tiered_fuzz_cap: 66
          - variant: p4
            tags: 'wangshu_p4 wangshu_profile'
            native_fuzz_cap: 218
            native_fuzz_targets: 6
            fuzztime: 26m
            tiered_fuzz_cap: 62
    name: diff-fuzz (${{ matrix.variant }})
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      # The `uses:` steps need bounds too. A hang in either still consumes the whole 350-minute job and
      # takes the triage step with it -- the same outcome as an unbounded `run:`, and the reason the PR's
      # claim of "every step" was not yet true (review finding). Checkout and toolchain setup take well
      # under a minute normally; 10 leaves ample room for a slow cache or a registry hiccup.
      - uses: actions/checkout@v6
        timeout-minutes: 10
      - uses: actions/setup-go@v6
        timeout-minutes: 10
        with:
          go-version-file: go.mod

      - name: install lua 5.1.5 oracle (source build)
        # Step-level bound, covering EVERY command here rather than one of them.
        #
        # The #236-#241 round bounded the curl inside fetch-lua-tarball.sh and left apt-get, make and
        # check-oracle.sh unbounded in the same step -- scoped to the symptom instead of to the step. On
        # 2026-08-18 the p1 leg sat 5h50m in this step and was killed by the JOB timeout, losing almost
        # the whole run: rolling-seed and auto-mode were skipped and both go-fuzz steps never started.
        # A step-level timeout turns that into a 12-minute failure, and it keeps holding when a command
        # is added later, which a per-command wrapper would not.
        timeout-minutes: 12
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libreadline-dev
          # Bounded + retried + checksum-verified (#236-#241): a bare curl with no --max-time sat
          # ~2m15s on an unreachable lua.org and exited 28 (curl's TIMEDOUT), which failed this step
          # and left the differential fuzz steps skipped -- a run reporting failure while testing
          # nothing, and six issues filed for one upstream blip.
          ./scripts/fetch-lua-tarball.sh
          make -C lua-5.1.5 posix -j2
          sudo cp lua-5.1.5/src/lua /usr/local/bin/lua5.1
          ./scripts/check-oracle.sh

      - name: rolling-seed differential fuzz (${{ matrix.variant }})
        # Step-level bound as well as the inner `go test -timeout 150m`: -timeout only watches the
        # go test process, so a command added to this step later would be unguarded except by the
        # job cap -- which is exactly how the oracle-install step came to sit 5h50m.
        timeout-minutes: 170
        id: difffuzz
        run: |
          # Hour epoch as rolling seed base (2026-07-10, was day epoch —
          # required by the 6x/day schedule: a day epoch would make all
          # six daily runs re-explore the same segment). Fresh seed space
          # each run; the seed for a failing run replays
          # deterministically. Seed segment stride 1e7, sized for 2M
          # scripts/run (~1ms/script locally, 35-60 min) with 5x safety
          # headroom; consecutive hour buckets never overlap (2M << 1e7).
          # p3 (wazero init + promotion + wasm dispatch) and p4 (jit mmap
          # + native emit + trampoline) may be slightly slower than p1;
          # the 150m timeout absorbs both.
          SEED_BASE=$(( $(date -u +%s) / 3600 * 10000000 ))
          ROUNDS="${{ github.event.inputs.rounds || '2000000' }}"
          echo "seed_base=$SEED_BASE" >> "$GITHUB_OUTPUT"
          echo "rounds=$ROUNDS" >> "$GITHUB_OUTPUT"
          set -o pipefail
          TAGS_ARG=""
          if [ -n "${{ matrix.tags }}" ]; then
            TAGS_ARG="-tags \"${{ matrix.tags }}\""
          fi
          eval WANGSHU_FUZZ_SEED_BASE=$SEED_BASE WANGSHU_FUZZ_N=$ROUNDS \
            go test $TAGS_ARG ./test/difftest/ -run 'TestDiff_RandomScripts' -timeout 150m 2>&1 | tee difffuzz.log

      - name: GC-stress transparency fuzz (${{ matrix.variant }})
        if: always()
        # Step-level bound as well as the inner `go test -timeout 60m`: -timeout only watches the
        # go test process, so a command added to this step later would be unguarded except by the
        # job cap -- which is exactly how the oracle-install step came to sit 5h50m.
        timeout-minutes: 75
        run: |
          set -o pipefail
          TAGS_ARG=""
          if [ -n "${{ matrix.tags }}" ]; then
            TAGS_ARG="-tags \"${{ matrix.tags }}\""
          fi
          eval WANGSHU_GCSTRESS_N="${{ github.event.inputs.gcstress || '200000' }}" \
            go test $TAGS_ARG ./test/difftest/ -run 'TestGCStress' -timeout 60m 2>&1 | tee gcstress.log

      # AUTO-mode rolling-seed diff (p3/p4 only; no-op match on p1).
      # Production runs auto, not force-all: this leg drives the
      # natural-heat promotion decision chain (threshold crossing
      # mid-run, runtime compilability recheck, profitability gate,
      # short-proto floor + exemption) via lowered thresholds and
      # diffs every run against the same-build interpreter baseline.
      - name: auto-mode rolling-seed diff (${{ matrix.variant }})
        if: always() && matrix.tags != ''
        # Step-level bound as well as the inner `go test -timeout 150m`: -timeout only watches the
        # go test process, so a command added to this step later would be unguarded except by the
        # job cap -- which is exactly how the oracle-install step came to sit 5h50m.
        timeout-minutes: 170
        run: |
          set -o pipefail
          # Hour epoch, same formula as the main leg. This step starts
          # later in the same job, so the recompute may land in the next
          # hour bucket — harmless: each leg's replay only needs its own
          # SEED_BASE, and the auto leg exploring a different segment
          # from the main leg costs nothing.
          SEED_BASE=$(( $(date -u +%s) / 3600 * 10000000 ))
          ROUNDS="${{ github.event.inputs.rounds || '2000000' }}"
          # Auto leg runs each seed 3x (baseline + 2 auto runs): third
          # of the rounds keeps wall-clock comparable to the main leg.
          AUTO_ROUNDS=$(( ROUNDS / 3 ))
          # No eval here (issue #81): eval re-parses the command line and
          # strips the -tags quoting, splitting "wangshu_p3 wangshu_profile"
          # into a tag + a bogus package argument. The main legs need eval
          # for their possibly-empty TAGS_ARG; this step is gated on
          # matrix.tags != '' so a plain invocation is correct.
          WANGSHU_FUZZ_SEED_BASE=$SEED_BASE WANGSHU_FUZZ_N=$AUTO_ROUNDS \
            go test -tags "${{ matrix.tags }}" ./test/difftest/ -run 'TestAuto_RandomScripts' -timeout 150m 2>&1 | tee autodiff.log

      # Fail LOUDLY when a manual gofuzztime cannot fit the step bound, instead of letting the bound
      # truncate the sweep and lose coverage silently (review finding). The bound is fixed per tier while
      # gofuzztime is a free-form input, so the two can disagree: dispatching 45m puts p4's six targets at
      # 270 min base, and one #75804 retry then exceeds the 280 bound. A silent truncation here looks
      # exactly like a healthy run that simply found nothing, which is the failure mode this whole branch
      # is about.
      - name: check the fuzz budget fits the step bound (${{ matrix.variant }})
        id: budgetcheck
        if: always()
        timeout-minutes: 5
        env:
          FUZZTIME: ${{ github.event.inputs.gofuzztime || matrix.fuzztime }}
          CAP: ${{ matrix.native_fuzz_cap }}
          TARGETS: ${{ matrix.native_fuzz_targets }}
        run: |
          set -euo pipefail
          # Accept only Nm / Nh / Ns so the arithmetic below cannot silently misread a unit.
          case "$FUZZTIME" in
            *m) mins="${FUZZTIME%m}" ;;
            *h) mins=$(( ${FUZZTIME%h} * 60 )) ;;
            *s) mins=$(( (${FUZZTIME%s} + 59) / 60 )) ;;
            *)  echo "gofuzztime '$FUZZTIME' must end in s, m or h" >&2; exit 1 ;;
          esac
          # Two thresholds, because two different things can be wrong.
          #
          # FAIL threshold = one pass plus ONE retry. A retry is an observed, ordinary event (9 in ~450
          # sampled jobs), so a budget that cannot absorb a single one is simply misconfigured: at 45m the
          # p4 leg needs 315m against a 280 bound, and the truncation would look like a healthy run that
          # found nothing.
          #
          # WORST = base plus two golang/go#75804 retries. p1's cap is deliberately BELOW its worst
          # (140 base, 210 worst, 195 cap) because the p1 chain has to leave room for the oracle-diff,
          # upload and triage steps that follow it under `if: always()`; a p1 run that retries twice is
          # accepted as indistinguishable from a hang, since retries measured 9 in ~450 jobs and never
          # twice in one job. So a short retry allowance is a WARNING, not a failure -- and a check that
          # failed the default configuration would be worse than the truncation it replaces.
          base=$(( mins * TARGETS ))
          one=$(( base + mins ))
          worst=$(( base + 2 * mins ))
          echo "fuzztime=${FUZZTIME} (${mins}m) x ${TARGETS} targets: base ${base}m, worst ${worst}m, cap ${CAP}m"
          if [ "$one" -gt "$CAP" ]; then
            echo "::error::gofuzztime=${FUZZTIME} needs ${one}m for one pass over ${TARGETS} targets plus a single retry, above the ${CAP}m step bound."
            echo "::error::A retry is a normal event here (measured 9 in ~450 jobs), so the sweep would be truncated and coverage lost silently. Use about $(( CAP / (TARGETS + 1) ))m, or raise native_fuzz_cap in the matrix and re-check the chain against the job cap."
            exit 1
          fi
          if [ "$worst" -gt "$CAP" ]; then
            echo "::warning::gofuzztime=${FUZZTIME} fits one pass (${base}m) but not two retries (${worst}m) within ${CAP}m; a double retry would be cut short. Accepted for this tier."
          fi

      - name: native go-fuzz long run (${{ matrix.variant }})
        # Gated on the budget check, not a bare always() (review finding). With always() the check could
        # fail and this step would start regardless, so the check changed nothing: an over-budget dispatch
        # still burned hours and still got truncated. A precheck that does not gate the thing it checks is
        # decoration.
        if: always() && steps.budgetcheck.outcome == 'success'
        # This step is the job's real cost centre: go-fuzz.sh discovers targets by SOURCE SCAN and runs
        # each for the full fuzztime, so 45m per target becomes ~270 min observed here, not 45 -- the
        # script's own header already recorded this shape once ("the nightly p1 leg once blew past the
        # 350m job timeout at 5x45m").
        #
        # The bound is sized to stop a HANG, not to make the step caps sum under the job cap. Those are
        # different jobs: the JOB timeout is the budget, and a step bound exists so one wedged command
        # cannot silently consume it. Sizing every step to sum under 350 would force cuts far deeper than
        # the observed cost justifies.
        #
        # 320 = worst measured leg + TWO retries + slack. Target counts differ per tier (measured: p1 4,
        # p3 5, p4 6 target-runs), so at 35m the legs cost about 140 / 175 / 210 min.
        #
        # The retry term is per TARGET, not per leg: go-fuzz.sh calls run_target once per discovered target
        # and each gets its own two attempts for golang/go#75804's spurious deadline, with nothing capping
        # retries across the leg. So two different targets in the p4 leg can each retry, giving
        # 210 + 35 + 35 = 280 -- which an earlier value of 280 consumed exactly, leaving zero room on a
        # HEALTHY run. Sizing off one retry was the same mistake as sizing off the median, one step out.
        # An audit found a real 315-min run under the old 45m value, so retries do occur in practice.
        #
        # The constraint is TWO-SIDED, which took three rounds to state properly. A step bound must
        #   (lower) exceed the worst legitimate cost -- 280 here, and 280 exactly was too tight; and
        #   (upper) fire BEFORE the job cap, i.e. be under 350 minus whatever earlier steps consumed.
        # About 40 min elapses before this step (install 1, rolling-seed 36, GC-stress 1, auto-mode 2), so
        # 320 would trip at ~360 -- after the 350 job cap, making it unreachable and leaving a hang here to
        # produce the same "cancelled, triage skipped, silent loss" outcome this whole change exists to
        # prevent. The window is 280..310; 300 sits inside it.
        timeout-minutes: ${{ matrix.native_fuzz_cap }}
        run: |
          set -o pipefail
          ./scripts/go-fuzz.sh "${{ github.event.inputs.gofuzztime || matrix.fuzztime }}" "${{ matrix.tags }}" 2>&1 | tee gofuzz.log

      # cgo oracle differential go-fuzz (p1 leg only): the embedded
      # official 5.1.5 diffs against the interpreter tier -- P1 is the
      # semantic anchor; p3/p4 close the loop against P1 via the
      # existing three-way difftests above. Unlike the rolling-seed
      # leg (well-formed generator scripts), go-fuzz mutates arbitrary
      # source bytes, covering irregular/adversarial shapes. Crashes
      # land in gofuzz-triage via the same "Failing input written to"
      # marker, so the log is appended to gofuzz.log's triage scope.
      # The FuzzOracleDiff filter is required: build tags are additive,
      # so the cgo build also compiles every default-build target and
      # an unfiltered sweep re-runs all of them (5 x 45m blew past the
      # 350m job timeout and the p1 leg got cancelled silently).
      - name: oracle-diff go-fuzz long run (p1 vs embedded 5.1.5)
        # Gated on the budget check too: this step runs the same go-fuzz.sh sweep, so an over-budget
        # dispatch would be truncated here in exactly the same way.
        if: always() && matrix.variant == 'p1' && steps.budgetcheck.outcome == 'success'
        # 80, not 120: a single target (FuzzOracleDiff) at 35m with one retry is 70 minutes, so 120 was
        # 50 minutes of slack -- and slack HERE is subtracted from what the native step before it may
        # spend, because this step runs `if: always()` after it. See the chain note on that step.
        timeout-minutes: 80
        run: |
          set -o pipefail
          CGO_ENABLED=1 ./scripts/go-fuzz.sh \
            "${{ github.event.inputs.gofuzztime || matrix.fuzztime }}" \
            "wangshu_oracle_cgo" FuzzOracleDiff 2>&1 | tee oraclefuzz.log

      # The TIERED counterpart of the step above, on p3/p4 instead of p1. Before this existed the tiers'
      # only fuzz evidence against PUC was transitive (tiered == P1 via FuzzAutoPromote/FuzzP4ForceAllPromote,
      # P1 == PUC via FuzzOracleDiff), which inherits P1's blind spots and cannot see a divergence where P1
      # agrees with PUC but both tiers agree with each other on something else.
      #
      # Budget: one target at the same fuzztime as the p1 oracle step, so the chain arithmetic in the native
      # step's note holds unchanged -- p3/p4 do not run the p1 oracle step, so this slots into the same slot
      # rather than adding to it.
      - name: tiered-oracle go-fuzz long run (${{ matrix.variant }} vs embedded 5.1.5)
        if: always() && matrix.variant != 'p1' && steps.budgetcheck.outcome == 'success'
        timeout-minutes: ${{ matrix.tiered_fuzz_cap }}
        run: |
          set -o pipefail
          CGO_ENABLED=1 ./scripts/go-fuzz.sh \
            "${{ github.event.inputs.gofuzztime || matrix.fuzztime }}" \
            "wangshu_oracle_cgo ${{ matrix.tags }}" FuzzOracleDiffTiered 2>&1 | tee tieredfuzz.log

      - name: upload logs and crash corpus
        if: always()
        timeout-minutes: 15
        uses: actions/upload-artifact@v7
        with:
          name: nightly-fuzz-${{ matrix.variant }}-${{ github.run_id }}
          path: |
            difffuzz.log
            tieredfuzz.log
            gcstress.log
            autodiff.log
            gofuzz.log
            oraclefuzz.log
            **/testdata/fuzz/**
            **/fuzz-forensics/**
          if-no-files-found: ignore

      - name: triage and file divergence issue
        if: failure()
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
          SEED_BASE: ${{ steps.difffuzz.outputs.seed_base }}
          ROUNDS: ${{ steps.difffuzz.outputs.rounds }}
        run: |
          # Triage by failure evidence, not merely by the failed step:
          #   1. DIVERGENCE seed=<n> kind=<bytediff|gcstress|oracle-error> -> bug
          #   2. go-fuzz "Failing input written to <path>" -> bug + crash corpus path
          #   3. worker watchdog/fatal without a corpus -> bug, needs investigation
          #   4. unmarked failure (oracle install, environment, step timeout) -> ci
          # Priority: DIVERGENCE > corpus crash > worker failure > INFRA; file only one issue.
          # All go-fuzz producers must be included (#255: tieredfuzz.log was uploaded but never scanned).
          FUZZ_LOGS=(gofuzz.log oraclefuzz.log tieredfuzz.log)
          if grep -q "DIVERGENCE" difffuzz.log gcstress.log autodiff.log 2>/dev/null; then
            FIRST_SEED=$(grep -ohP 'DIVERGENCE seed=\K\d+' difffuzz.log gcstress.log autodiff.log 2>/dev/null | head -1 || true)
            FIRST_KIND=$(grep -ohP 'DIVERGENCE seed=\d+ kind=\K\S+' difffuzz.log gcstress.log autodiff.log 2>/dev/null | head -1 || true)
            TITLE="difftest divergence (${{ matrix.variant }}): seed ${FIRST_SEED:-unknown} kind ${FIRST_KIND:-unknown} ($(date -u +%F))"
            LABEL="bug"
            BODY=$(cat <<EOF
          nightly 差分 fuzz 撞出与官方 Lua 5.1.5 的输出分歧(或 GC 透明性破坏)。

          **本地复现**:
          \`\`\`bash
          # 差分分歧(精确种子重放)
          WANGSHU_FUZZ_SEED_BASE=${FIRST_SEED:-$SEED_BASE} WANGSHU_FUZZ_N=1 \\
            go test ./test/difftest/ -run TestDiff_RandomScripts -v
          # 本轮完整种子段
          WANGSHU_FUZZ_SEED_BASE=$SEED_BASE WANGSHU_FUZZ_N=$ROUNDS \\
            go test ./test/difftest/ -run TestDiff_RandomScripts
          \`\`\`

          **后续**(12 §3.6):最小化分歧脚本后回流为 conformance 用例,回归不依赖再次随机撞中。
          日志与 crash corpus 见 run artifacts:${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF
          )
          elif grep -q "Failing input written to" "${FUZZ_LOGS[@]}" 2>/dev/null; then
            CRASH_PATH=$(grep -ohP 'Failing input written to \K\S+' "${FUZZ_LOGS[@]}" 2>/dev/null | head -1 || true)
            CRASH_NAME=$(basename "$CRASH_PATH")
            # Fuzz target = the path segment above the corpus hash
            # (testdata/fuzz/<FuzzTarget>/<hash>) — needed for an exact
            # -run pattern. The old template ran the bare hash with no
            # target prefix and no build tags, matching nothing
            # ("no tests to run"; PR #126 review finding).
            CRASH_TARGET=$(basename "$(dirname "$CRASH_PATH")")
            case "$CRASH_TARGET" in
              # oracle-diff crashers replay under the cgo oracle build,
              # regardless of the matrix leg that caught them.
              FuzzOracleDiff) REPLAY_TAGS='wangshu_oracle_cgo' ;;
              FuzzOracleDiffTiered) REPLAY_TAGS="wangshu_oracle_cgo ${{ matrix.tags }}" ;;
              *) case "${{ matrix.variant }}" in
                   p3) REPLAY_TAGS='wangshu_p3 wangshu_profile' ;;
                   p4) REPLAY_TAGS='wangshu_p4 wangshu_profile' ;;
                   *)  REPLAY_TAGS='' ;;
                 esac ;;
            esac
            TITLE="go-fuzz crash (${{ matrix.variant }}): ${CRASH_NAME:-unknown} ($(date -u +%F))"
            LABEL="bug"
            BODY=$(cat <<EOF
          nightly go-fuzz 长跑撞出 crash(子进程异常退出/死循环/panic)。corpus 已写入仓库
          \`testdata/fuzz/\` 路径,可本地精确重放定位根因。

          **crash corpus 路径**:\`$CRASH_PATH\`

          **本地复现**:
          \`\`\`bash
          # 从 run artifact 下载 corpus(若仓库还没入库)
          gh run download ${{ github.run_id }} --repo ${{ github.repository }}
          # 复制到对应路径
          cp nightly-fuzz-${{ matrix.variant }}-${{ github.run_id }}/$CRASH_PATH $CRASH_PATH
          # replay (tags match the crashed target; FuzzOracleDiff needs CGO_ENABLED=1)
          go test${REPLAY_TAGS:+ -tags "$REPLAY_TAGS"} . \\
            -run="^${CRASH_TARGET}/${CRASH_NAME}\$" -count=1 -timeout 60s -v
          \`\`\`

          **后续**(12 §4.9 嵌入式 hardening 阈值纪律):定位触发 crash 的 stdlib/VM 路径,加 fail-fast 阈值;
          补回归用例;corpus 入库位置按 llmdoc/guides/unreproducible-crasher-triage.md 的判据选
          (轻量 budget-bounded 形状 → \`testdata/fuzz/\` 常驻回归;重 workload → 显式回归测试,防
          fuzz coordinator 并行重放压垮 worker)。
          日志与 crash corpus 见 run artifacts:${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF
          )
          elif grep -Eq "hung or terminated unexpectedly|panic: deadlocked" "${FUZZ_LOGS[@]}" 2>/dev/null; then
            TITLE="go-fuzz worker failure (${{ matrix.variant }}): $(date -u +%F)"
            LABEL="bug"
            BODY="nightly go-fuzz worker 异常退出或触发看门狗，属于被测 fuzz 路径的 bug 信号，不是基础设施失败。日志中的 failing input、worker 栈迹和取证文件见 run artifacts:${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}。"
          else
            #
            # An environment failure hits all three tiers at once, so a variant in the title made
            # three distinct titles that the dedupe below could not see as one event: two blips on
            # 2026-08-07 filed six issues. Keying on the run id fixes that but is worse in the other
            # direction, because the schedule runs six times a day -- a day-long outage would then
            # file six issues where variant+date capped at three. The date collapses BOTH axes, and
            # every extra tier or run adds a comment instead.
            TITLE="nightly-fuzz infra failure ($(date -u +%F))"
            LABEL="ci"
            # State plainly whether the differential steps RAN. A failing setup step leaves them
            # skipped, so the run reports red while having tested nothing -- and red's default
            # reading is "we tested and found a problem", which is the optimistic direction. The
            # step outcome is available here, so the body says which it was instead of leaving the
            # reader to infer it from the log.
            DIFF_RAN="${{ steps.difffuzz.outcome }}"
            case "$DIFF_RAN" in
              skipped|"") RAN_NOTE="**本轮未执行任何差分 fuzz**(差分步骤被 skip,通常是前置的 oracle 安装步骤失败)。红色不代表测过了。" ;;
              *)          RAN_NOTE="差分 fuzz 步骤状态:${DIFF_RAN}。" ;;
            esac
            BODY="nightly fuzz 失败但无 DIVERGENCE 标记 / 无 go-fuzz crash(环境/基础设施类:oracle 不可用、超时、依赖装不上等)。${RAN_NOTE} 首个报告的 tier:${{ matrix.variant }}。日志见 run artifacts:${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
          # Dedupe by title: comment on an existing open issue instead of filing a new one
          # Search is eventually consistent, so three near-simultaneous jobs can each see "none" and
          # each file. Retry the lookup briefly before deciding to create: the p3/p4 legs run an
          # identical step set after an install failure and reach this point within seconds of each
          # other, so a single unlucky read would still produce duplicates. This narrows the window
          # rather than closing it -- closing it needs a job-level concurrency group, which would
          # serialize the three tiers and is a bigger change than this branch should make.
          EXISTING=""
          for attempt in 1 2 3; do
            EXISTING=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number' || true)
            if [ -n "$EXISTING" ] && [ "$EXISTING" != "null" ]; then break; fi
            [ "$attempt" -lt 3 ] && sleep $(( attempt * 5 )) || true
          done
          if [ -n "$EXISTING" ] && [ "$EXISTING" != "null" ]; then
            gh issue comment "$EXISTING" --body "再次触发:run ${{ github.run_id }}(tier ${{ matrix.variant }})"
          else
            gh issue create --title "$TITLE" --label "$LABEL" --body "$BODY"
          fi
