name: Agentic PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - "docs/**"
      - "llmdoc/**"
      - ".claude/**"
      - "**.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  pr-review:
    # Hang guard (2026-08-19): this workflow had no timeout anywhere, and a CI run hung ~45 min on
    # `apt-get` while the nightly fix for that same unbounded-step failure was under review. Sized
    # well above observed cost, so it only fires on a wedge.
    timeout-minutes: 60
    uses: Lightspeed-Intelligence/agentic-workflow-template/.github/workflows/pr-review.yml@main
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
      PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
      FEISHU_WEBHOOK_TOKEN: ${{ secrets.FEISHU_WEBHOOK_TOKEN }}
    with:
      use_feishu_notify: true
